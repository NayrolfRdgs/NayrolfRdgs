name: Update Last.fm Top Artists

on:
workflow_dispatch:
schedule:
- cron: "0 6 * * *"

permissions:
contents: write

jobs:
update-lastfm:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install Python dependencies
    run: python3 -m pip install requests

  - name: Update artists
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
    run: python3 .github/scripts/lastfm.py

  - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add README.md
      if git diff --cached --quiet; then
        echo "No changes."
      else
        git commit -m "🎵 Update Last.fm top artists"
        git push
      fi
```
